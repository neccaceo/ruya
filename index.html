<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>캐릭터 안내</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="stage">
    <div id="intro-phrase">
      <span class="headline">여기즈음 캐프</span>
      <span class="subline">~! 어서 오세요</span>
    </div>

    <div id="carousel">
      <div class="char-slide">
        <div class="char-panel" id="char-panel">
          <p class="char-catch" id="char-catch"></p>
          <h2 class="char-name" id="char-name"></h2>
          <p class="char-meta" id="char-meta"></p>
          <p class="char-desc" id="char-desc"></p>
        </div>
        <button class="collapse-btn" id="collapse-btn" aria-label="상자 크기 전환">‹</button>
        <div class="char-image-wrap">
          <img class="char-image" id="char-image" alt="" />
        </div>
      </div>

      <div class="dots" id="dots"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
